# Publie l'APPLICATION sur GitHub Pages — aucune donnée : elles restent
# derrière l'API, protégée par jeton (§26, §28).
#
# `API_URL` n'est pas un secret (URL publique du Worker) ; sans elle, le site
# affiche « non connectée ». Activer Pages une fois dans Settings suffit.

name: Déploiement du frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire l'application
        run: pnpm --filter @rentfinder/frontend run build
        env:
          # GitHub Pages sert le site depuis /<nom-du-depot>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
          # Clé PUBLIQUE du serveur de push : elle doit entrer dans le bundle,
          # sans quoi le navigateur ne peut pas s'abonner. Ce n'est pas un
          # secret — la clé privée, elle, ne sert qu'à la collecte.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

      - name: Vérifier qu'aucun secret n'a été embarqué
        # Un jeton glissé dans le bundle serait publié définitivement (§26).
        run: |
          if grep -rIlE 'eyJ[A-Za-z0-9_-]{20,}\.|libsql://[a-z0-9-]+\.turso\.io|[0-9]{9,10}:AA[A-Za-z0-9_-]{30,}' frontend/dist; then
            echo "::error::Un secret potentiel a été détecté dans le bundle — déploiement annulé."
            exit 1
          fi
          echo "Aucun secret détecté dans le bundle."

      # `enablement: true` ne marche pas ici : le jeton du workflow peut
      # DÉPLOYER sur Pages mais pas CRÉER le site (« Resource not accessible by
      # integration »). L'activation reste donc une action une fois pour toutes,
      # dans Settings → Pages → Source « GitHub Actions ».
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
