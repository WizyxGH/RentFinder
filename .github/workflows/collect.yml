# Collecte planifiée dans le cloud (§29) — mode cloud OPTIONNEL.
#
# UN SEUL workflow pour toutes les sources : le scheduler interne décide, à
# chaque réveil, quelles sources méritent d'être interrogées (§7). Augmenter le
# nombre de sources n'augmente donc ni les workflows ni le coût (§30).
#
# Ce workflow ne fait RIEN tant que le secret TURSO_DATABASE_URL n'est pas
# configuré : un fork ou un clone du dépôt reste 100% local sans effort.
# Les notifications Telegram partent d'ici si les secrets TELEGRAM_* existent.

name: Collecte

on:
  schedule:
    # Toutes les 30 minutes. Le scheduler interne filtre ensuite : une source
    # dont l'intervalle n'est pas écoulé n'émet aucune requête.
    # Note : GitHub Actions ne garantit pas la ponctualité des crons.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Mode backfill (récupération d’annonces plus anciennes)'
        type: boolean
        default: false
      verbose:
        description: 'Journalisation détaillée'
        type: boolean
        default: false

# Deux collectes simultanées écriraient en concurrence dans Turso et
# doubleraient les requêtes vers les sources.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Cycle de collecte
    runs-on: ubuntu-latest
    # Borne dure : une source qui traîne ne doit pas consommer le quota.
    timeout-minutes: 20
    # Sans base cloud configurée, on ne consomme aucune minute.
    if: ${{ vars.CLOUD_COLLECT_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire les paquets
        run: pnpm -r --filter "./packages/*" run build

      - name: Lancer la collecte (migrations incluses)
        run: |
          ARGS=""
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          pnpm run collect -- $ARGS
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

          # §29 : notifications Telegram — absentes = notifieur désactivé.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MIN_PRIORITY: ${{ vars.TELEGRAM_MIN_PRIORITY }}
          TELEGRAM_MAX_PER_RUN: ${{ vars.TELEGRAM_MAX_PER_RUN }}

          # §6 : accès abonné BEP payé par l'utilisateur — optionnel.
          BEP_SUBSCRIBER_USER: ${{ secrets.BEP_SUBSCRIBER_USER }}
          BEP_SUBSCRIBER_PASSWORD: ${{ secrets.BEP_SUBSCRIBER_PASSWORD }}

          # Identification honnête du collecteur (§10).
          COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}

          # §8 : le backfill exige l'intention explicite ET l'activation.
          BACKFILL_ENABLED: ${{ vars.BACKFILL_ENABLED }}

          # §23 : interrupteur global du contact automatique. Absent = OFF.
          AUTO_CONTACT_ENABLED: ${{ vars.AUTO_CONTACT_ENABLED }}

          # §20 : points de référence privés, stockés en SECRETS de dépôt.
          # Leur absence désactive simplement le calcul des distances.
          REFERENCE_WORK_LABEL: ${{ vars.REFERENCE_WORK_LABEL }}
          REFERENCE_WORK_LAT: ${{ secrets.REFERENCE_WORK_LAT }}
          REFERENCE_WORK_LON: ${{ secrets.REFERENCE_WORK_LON }}
          REFERENCE_WORK_ADDRESS: ${{ secrets.REFERENCE_WORK_ADDRESS }}
          REFERENCE_STATION_LABEL: ${{ vars.REFERENCE_STATION_LABEL }}
          REFERENCE_STATION_LAT: ${{ secrets.REFERENCE_STATION_LAT }}
          REFERENCE_STATION_LON: ${{ secrets.REFERENCE_STATION_LON }}
