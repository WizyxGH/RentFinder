<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Outil personnel : aucune raison d'être indexé. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Favicon en SVG inline : l'emoji est dessiné par le navigateur, donc
      aucun fichier à héberger ni requête supplémentaire. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E"
    />
    <!-- Manifeste requis pour installer le site sur l'écran d'accueil, seule
      façon de recevoir des notifications sur iOS (16.4+). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <title>RentFinder — Nice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
