# Worker Cloudflare — l'API du site publié (§28).
#
# Les trois secrets ne figurent PAS ici : ce fichier est versionné. On les
# dépose une fois avec `wrangler secret put` (voir docs/deployment.md).
#
#   TURSO_DATABASE_URL   l'adresse libsql:// de la base
#   TURSO_AUTH_TOKEN     le jeton, qui ne doit plus jamais atteindre un navigateur
#   SESSION_SECRET       la clé de signature des sessions
name = "rentfinder-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# L'origine autorisée à appeler l'API. Un « * » serait refusé par les
# navigateurs dès lors qu'on envoie un cookie — et il le serait à raison.
ALLOWED_ORIGIN = "https://wizyxgh.github.io"

# --- Pièces du dossier de candidature (§25) — DÉSACTIVÉ PAR DÉFAUT ----------
#
# CE BLOC EST COMMENTÉ POUR UNE RAISON DE FACTURATION, PAS DE TECHNIQUE.
# Le Worker se déploie sur le palier gratuit sans aucune carte bancaire. R2,
# lui, exige d'enregistrer un moyen de paiement AVANT de pouvoir créer le
# moindre seau — y compris pour son propre palier gratuit (10 Go). Laisser ce
# binding actif imposait donc une carte à quiconque déploie le projet, pour une
# fonctionnalité annexe.
#
# Le déploiement échouerait d'ailleurs tant que le seau n'existe pas : un
# binding pointe vers un seau qu'on doit avoir créé.
#
# POUR L'ACTIVER, deux gestes, dans cet ordre :
#
#   npx wrangler r2 bucket create rentfinder-documents   # demande une carte
#   puis décommenter les trois lignes ci-dessous, et redéployer.
#
# Sans ce binding, l'API répond 501 sur /api/documents et l'écran du dossier ne
# s'affiche pas — plutôt que d'accepter des fichiers pour les perdre. Tout le
# reste du site fonctionne à l'identique.
#
# [[r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "rentfinder-documents"
